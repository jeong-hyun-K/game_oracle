name: OneDrive 폴더 다운로더 APK 빌드

on:
  push:
    paths:
      - "onedrive_downloader_android/**"
      - ".github/workflows/onedrive-downloader-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onedrive_downloader_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK 이름 정리
        id: apk
        run: |
          name="OneDriveFolderDownloader-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=onedrive_downloader_android/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OneDriveFolderDownloader-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Releases에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onedrive-downloader-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OneDrive 폴더 다운로더 (빌드 ${{ github.run_number }})
          body: |
            휴대폰에서 아래 **OneDriveFolderDownloader-build${{ github.run_number }}.apk** 를 눌러 받은 뒤 설치하세요.
            사용 방법은 저장소의 `onedrive_downloader_android/README.md` 를 참고하세요.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
