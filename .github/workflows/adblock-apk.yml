name: 광고 차단기 APK 빌드

on:
  push:
    paths:
      - "adblock_app/**"
      - ".github/workflows/adblock-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adblock_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 및 APK 빌드
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: adblock-apk
          path: adblock_app/app/build/outputs/apk/debug/app-debug.apk
